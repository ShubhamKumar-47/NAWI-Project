{% extends "base/_auth.html" %}
{% load crispy_forms_tags %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="mb-4 text-center">
  <div class="text-primary fs-3 mb-2"><i class="bi bi-key"></i></div>
  <h5 class="fw-bold text-dark mb-1">Reset Password</h5>
  <p class="text-muted small mb-0">Enter your registered email address and we'll send you instructions to reset your password.</p>
</div>

{% crispy form %}

<div class="text-center mt-3">
  <a href="{% url 'accounts:login' %}" class="small text-decoration-none">
    <i class="bi bi-arrow-left me-1"></i>Back to Sign In
  </a>
</div>
{% endblock %}
