{% extends "base/_auth.html" %}
{% block title %}Account Locked{% endblock %}
{% block content %}
<div class="text-center">
  <i class="bi bi-lock-fill text-danger" style="font-size: 3rem;"></i>
  <h5 class="mt-3 text-danger">Account Temporarily Locked</h5>
  <p class="text-muted">Too many failed login attempts. Please wait 1 hour and try again, or contact your administrator.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Back to Login</a>
</div>
{% endblock %}
