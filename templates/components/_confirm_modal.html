{% comment %}
Usage: {% include "components/_confirm_modal.html" with modal_id="deleteModal" title="Confirm Delete" body="Are you sure?" action_url=delete_url action_label="Delete" action_class="btn-danger" %}
{% endcomment %}
<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-labelledby="{{ modal_id }}Label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header py-3">
        <h5 class="modal-title fw-bold text-dark d-flex align-items-center gap-2" id="{{ modal_id }}Label">
          <i class="bi bi-exclamation-triangle-fill text-warning"></i>
          <span>{{ title }}</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4 text-secondary">
        {{ body }}
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <form method="post" action="{{ action_url }}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn {{ action_class|default:'btn-danger' }} btn-sm px-3" data-loading-text="Processing...">
            {{ action_label|default:"Confirm" }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
